name: Publish to PyPI

# Publishes the package to PyPI when a version tag (e.g. v0.1.0) is pushed.
#
# Setup (one time):
#   1. Create a PyPI account and an API token at https://pypi.org/manage/account/token/
#   2. In this repo: Settings -> Secrets and variables -> Actions -> New repository secret
#      Name:  PYPI_API_TOKEN
#      Value: the token (starts with "pypi-")
#
# Release a new version:
#   1. Bump `version` in pyproject.toml (and __version__ in disesfgewuAgent/__init__.py)
#   2. git tag v0.1.0 && git push origin v0.1.0
#   The tag push triggers this workflow, which builds and uploads to PyPI.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
